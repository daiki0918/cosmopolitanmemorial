<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a1a52" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Cosmopolitan Funeral Homes, Inc.</title>
    <style>
      #root{min-height:100vh}

      /* ───────── Splash: tokens ───────── */
      .splash-fallback{
        --sp-navy:#0a1a52;--sp-navy-2:#122870;--sp-sand:#d6bd8b;--sp-glow:69,89,255;
        --sp-ease:cubic-bezier(.22,1,.36,1);--sp-curtain:cubic-bezier(.76,0,.24,1);
        --sp-inset:22px;
      }

      /* ───────── Splash: root (transparent; curtain panels carry the background) ───────── */
      .splash-fallback{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;color:#fff;
        font-family:var(--font-heading,"Playfair Display",Georgia,serif);
        /* Safety net only: hides the splash if the app never removes it. Animates visibility only. */
        animation:splash-fallback-max 3.6s step-end forwards}
      .splash-fallback.is-exiting{opacity:0;pointer-events:none;transition:opacity 0s .6s}

      /* ───────── Curtain panels ───────── */
      .splash-fallback-panel{position:absolute;top:0;bottom:0;width:calc(50% + 1px);
        background:
          radial-gradient(ellipse 70% 55% at 100% 0%,rgba(var(--sp-glow),.28),transparent 60%),
          linear-gradient(115deg,var(--sp-navy),var(--sp-navy-2) 55%,var(--sp-navy));
        background-size:200% 100%;
        transition:transform .55s var(--sp-curtain) .02s;will-change:transform}
      .splash-fallback-panel.is-left{left:0;background-position:0 0}
      .splash-fallback-panel.is-right{right:0;background-position:100% 0}
      .is-exiting .splash-fallback-panel.is-left{transform:translateX(-101%)}
      .is-exiting .splash-fallback-panel.is-right{transform:translateX(101%)}

      /* ───────── Stage (fades on exit) ───────── */
      .splash-fallback-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;transition:opacity .3s ease}
      .is-exiting .splash-fallback-stage{opacity:0}
      .splash-fallback-stage:before{position:absolute;inset:0;content:"";pointer-events:none;
        background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
        -webkit-mask-image:radial-gradient(ellipse at center,#000,transparent 72%);mask-image:radial-gradient(ellipse at center,#000,transparent 72%)}
      .splash-fallback-stage:after{position:absolute;inset:0 0 auto;height:1px;content:"";pointer-events:none;
        background:linear-gradient(90deg,transparent,rgba(214,189,139,.6) 30%,rgba(214,189,139,.6) 70%,transparent)}

      /* soft light rising from below, like first light */
      .splash-fallback-dawn{position:absolute;left:50%;bottom:-32vmax;width:96vmax;height:64vmax;margin-left:-48vmax;border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(214,189,139,.22),rgba(214,189,139,.07) 42%,transparent 68%);
        animation:splash-dawn 2.4s var(--sp-ease) both}

      /* corner brackets that draw themselves */
      .splash-fallback-corner{position:absolute;width:30px;height:30px;pointer-events:none}
      .splash-fallback-corner:before,.splash-fallback-corner:after{position:absolute;top:0;left:0;background:rgba(214,189,139,.55);content:""}
      .splash-fallback-corner:before{width:100%;height:1px;transform-origin:left;animation:splash-draw-x .9s var(--sp-ease) .1s both}
      .splash-fallback-corner:after{width:1px;height:100%;transform-origin:top;animation:splash-draw-y .9s var(--sp-ease) .1s both}
      .splash-fallback-corner.tl{top:var(--sp-inset);left:var(--sp-inset)}
      .splash-fallback-corner.tr{top:var(--sp-inset);right:var(--sp-inset);transform:scaleX(-1)}
      .splash-fallback-corner.bl{bottom:var(--sp-inset);left:var(--sp-inset);transform:scaleY(-1)}
      .splash-fallback-corner.br{bottom:var(--sp-inset);right:var(--sp-inset);transform:scale(-1)}

      /* ───────── Content ───────── */
      .splash-fallback-content{position:relative;display:grid;justify-items:center;text-align:center;transition:transform .5s var(--sp-ease)}
      .is-exiting .splash-fallback-content{transform:scale(1.05)}

      /* emblem: wipes in from the bottom, one slow halo ripples outward, a single light passes over it */
      .splash-fallback-mark{position:relative;display:grid;width:176px;height:176px;place-items:center;border-radius:50%;
        background:radial-gradient(circle,rgba(var(--sp-glow),.26),transparent 66%)}
      .splash-fallback-mark:before,.splash-fallback-mark:after{position:absolute;inset:10px;border:1px solid rgba(214,189,139,.5);border-radius:50%;content:"";opacity:0;animation:splash-ripple 3.2s ease-out .9s infinite}
      .splash-fallback-mark:after{animation-delay:2.5s}
      .splash-fallback img{position:relative;width:108px;height:104px;object-fit:contain;
        filter:brightness(0) invert(1) drop-shadow(0 6px 18px rgba(0,0,0,.35));
        animation:splash-wipe 1.1s var(--sp-ease) .15s both}
      .splash-fallback-shine{position:absolute;left:50%;top:50%;width:108px;height:104px;margin:-52px 0 0 -54px;pointer-events:none;
        -webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;
        background:linear-gradient(105deg,transparent 38%,rgba(214,189,139,.95) 50%,transparent 62%) 150% 0/250% 100% no-repeat;
        animation:splash-shine 3s ease-in-out 1s infinite}

      /* name tightens from wide tracking into place */
      .splash-fallback h1{margin:30px 0 0;font-size:clamp(2.1rem,7.5vw,3.3rem);font-weight:600;line-height:1;letter-spacing:-.025em;animation:splash-name 1.2s var(--sp-ease) .45s both}

      .splash-fallback p{display:flex;align-items:center;gap:14px;margin:16px 0 0;color:var(--sp-sand);font:600 .7rem/1.4 Inter,Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;animation:splash-rise .8s var(--sp-ease) .85s both}
      .splash-fallback p:before,.splash-fallback p:after{width:34px;height:1px;background:rgba(214,189,139,.55);content:""}

      /* progress line with a bright leading edge */
      .splash-fallback-line{position:relative;width:200px;height:2px;margin-top:34px;overflow:hidden;border-radius:2px;background:rgba(214,189,139,.2);animation:splash-fade .5s ease .6s both}
      .splash-fallback-line:after{display:block;width:100%;height:100%;content:"";transform:scaleX(0);transform-origin:left;
        background:linear-gradient(90deg,rgba(214,189,139,.6),var(--sp-sand) 70%,#fff);
        animation:splash-line 1.2s cubic-bezier(.4,0,.2,1) .1s forwards}

      .splash-fallback-tag{position:absolute;inset:auto 0 calc(var(--sp-inset) + 14px);display:flex;justify-content:center;align-items:center;gap:12px;
        font:600 .62rem/1 Inter,Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55);animation:splash-fade .8s ease .9s both}
      .splash-fallback-tag:before,.splash-fallback-tag:after{width:28px;height:1px;background:rgba(214,189,139,.5);content:""}

      /* ───────── Motion ───────── */
      @keyframes splash-dawn{from{opacity:0;transform:translateY(18vmax)}}
      @keyframes splash-draw-x{from{transform:scaleX(0)}}
      @keyframes splash-draw-y{from{transform:scaleY(0)}}
      @keyframes splash-wipe{from{opacity:0;clip-path:inset(100% 0 0 0)}to{opacity:1;clip-path:inset(0)}}
      @keyframes splash-ripple{0%{opacity:.7;transform:scale(.82)}100%{opacity:0;transform:scale(1.32)}}
      @keyframes splash-name{from{opacity:0;letter-spacing:.22em;filter:blur(8px)}}
      @keyframes splash-rise{from{opacity:0;transform:translateY(14px)}}
      @keyframes splash-fade{from{opacity:0}}
      @keyframes splash-line{to{transform:scaleX(1)}}
      @keyframes splash-shine{0%{background-position:150% 0}45%,100%{background-position:-50% 0}}
      @keyframes splash-fallback-max{to{visibility:hidden}}

      /* ───────── Small screens ───────── */
      @media (max-width:420px){
        .splash-fallback{--sp-inset:14px}
        .splash-fallback-mark{width:148px;height:148px}
        .splash-fallback img,.splash-fallback-shine{width:92px;height:88px}
        .splash-fallback-shine{margin:-44px 0 0 -46px}
        .splash-fallback p:before,.splash-fallback p:after{width:20px}
      }

      /* ───────── Accessibility ───────── */
      @media (prefers-reduced-motion:reduce){
        .splash-fallback.is-exiting{transition:opacity .4s ease}
        .splash-fallback *,.splash-fallback *:before,.splash-fallback *:after{animation:none!important}
        .is-exiting .splash-fallback-panel.is-left,.is-exiting .splash-fallback-panel.is-right,.is-exiting .splash-fallback-content{transform:none}
        .splash-fallback-mark:before,.splash-fallback-mark:after,.splash-fallback-shine{display:none}
        .splash-fallback-line:after{transform:scaleX(1);opacity:.6}
      }
    </style>
  </head>
  <body>
    <div class="splash-fallback" role="status" aria-live="polite">
      <span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Loading Cosmopolitan Funeral Homes</span>
      <div class="splash-fallback-panel is-left" aria-hidden="true"></div>
      <div class="splash-fallback-panel is-right" aria-hidden="true"></div>
      <div class="splash-fallback-stage" aria-hidden="true">
        <div class="splash-fallback-dawn"></div>
        <i class="splash-fallback-corner tl"></i><i class="splash-fallback-corner tr"></i>
        <i class="splash-fallback-corner bl"></i><i class="splash-fallback-corner br"></i>
        <div class="splash-fallback-content">
          <span class="splash-fallback-mark">
            <img src="/logo.png" width="3282" height="3046" alt="" />
            <i class="splash-fallback-shine"></i>
          </span>
          <h1>Cosmopolitan</h1>
          <p>Funeral Homes, Inc.</p>
          <div class="splash-fallback-line"></div>
        </div>
        <div class="splash-fallback-tag">Compassion · Dignity · Care</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
